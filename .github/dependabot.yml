version: 2

updates:
  # Keeps the SHA-pinned actions in .github/workflows current: a PR bumps the SHA and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after an action release before proposing it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # The django dev pin follows the Django release NetBox 4.7 runs on (6.1); only patch releases.
    ignore:
      - dependency-name: django
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      python:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
