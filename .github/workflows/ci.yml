name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -v -W error::DeprecationWarning

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make docs

  netbox-load:
    name: loads in NetBox ${{ matrix.netbox }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        netbox: ["v4.7.1"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox }}
          path: netbox
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install NetBox and plugin
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install ./plugin
      - name: Configure NetBox
        run: |
          cp netbox/netbox/netbox/configuration_testing.py netbox/netbox/netbox/configuration.py
          cat >> netbox/netbox/netbox/configuration.py <<'EOF'

          PLUGINS = ["netbox_opentelemetry_plugin"]
          PLUGINS_CONFIG = {
              "netbox_opentelemetry_plugin": {
                  "exporter": {"endpoint": "http://localhost:4318"},
              },
          }
          EOF
      # No database or Redis service: NetBox does not connect to either for check or shell startup.
      - name: System check
        run: python netbox/netbox/manage.py check
      - name: Handler attached
        run: |
          python netbox/netbox/manage.py shell -c "
          import logging
          from netbox_opentelemetry_plugin.otel import AllowlistLoggingHandler as H
          assert any(isinstance(h, H) for h in logging.getLogger('netbox').handlers), 'handler missing'
          print('handler attached')
          "
      - name: No endpoint configured
        run: |
          set -o pipefail
          cp netbox/netbox/netbox/configuration_testing.py netbox/netbox/netbox/configuration.py
          cat >> netbox/netbox/netbox/configuration.py <<'EOF'

          PLUGINS = ["netbox_opentelemetry_plugin"]
          # NetBox's default. configuration_testing.py disables existing loggers, which hides the warning.
          LOGGING = {}
          EOF
          python netbox/netbox/manage.py check 2>&1 | tee check.log
          grep -q "no endpoint configured" check.log

  netbox-integration:
    name: integration tests on NetBox ${{ matrix.netbox }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        netbox: ["v4.7.1"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: valkey/valkey:9.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox }}
          path: netbox
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install NetBox and plugin
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install ./plugin
      - name: Configure NetBox
        run: |
          cp netbox/netbox/netbox/configuration_testing.py netbox/netbox/netbox/configuration.py
          cat >> netbox/netbox/netbox/configuration.py <<'EOF'

          PLUGINS = ["netbox_opentelemetry_plugin"]
          PLUGINS_CONFIG = {
              "netbox_opentelemetry_plugin": {
                  "exporter": {"endpoint": "http://localhost:4318"},
                  "logs": {"enabled": False},
              },
          }
          EOF
      - name: Integration tests
        run: python netbox/netbox/manage.py test --noinput --parallel 1 "$GITHUB_WORKSPACE/plugin/tests_netbox"

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f dev/docker-compose.yml --profile gunicorn --profile uwsgi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Start the dev stack
        run: $COMPOSE up -d --build --wait --wait-timeout 600
      - name: End-to-end tests
        run: uv run pytest -m e2e tests/e2e -v
      - name: Collect compose logs
        if: failure()
        run: $COMPOSE logs --no-color > compose.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: |
            compose.log
            dev/data/collector/
          retention-days: 7
      - name: Stop the dev stack
        if: always()
        run: $COMPOSE down -v
