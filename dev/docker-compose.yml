name: netbox-otel-dev

x-netbox: &netbox
  build:
    context: ..
    dockerfile: dev/Dockerfile
  image: netbox-otel-dev:local
  env_file: env/netbox.env
  user: "netbox:root"
  volumes:
    - ./configuration/plugins.py:/etc/netbox/config/plugins.py:ro
    - ../netbox_opentelemetry_plugin:/plugin/netbox_opentelemetry_plugin:ro
    - ../tests_netbox:/plugin/tests_netbox:ro
    # tests/otel_helpers.py is shared between the unit and NetBox integration test suites.
    - ../tests:/plugin/tests:ro
    # Shared across all server processes: a script uploaded via one process (netbox) must be
    # readable by the process that runs it (netbox-worker), since SCRIPTS_ROOT is local disk.
    - netbox-scripts-files:/opt/netbox/netbox/scripts

services:
  netbox:
    <<: *netbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      otel-collector:
        condition: service_started
      webhook-sink:
        condition: service_started
    ports:
      - "8000:8080"
    environment:
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev,netbox.dev.server=granian
    healthcheck:
      test: /opt/netbox/health.sh
      # A fresh database runs every migration first, which takes several minutes on a CI runner.
      # The first passing check still marks the container healthy at once.
      start_period: 900s
      timeout: 3s
      interval: 15s

  netbox-worker:
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
      webhook-sink:
        condition: service_started
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker

  netbox-gunicorn:
    <<: *netbox
    profiles: ["gunicorn"]
    depends_on:
      netbox:
        condition: service_healthy
    environment:
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev,netbox.dev.server=gunicorn
    command:
      - /opt/netbox/venv/bin/gunicorn
      - --preload
      - --workers=3
      - --threads=3
      - --bind=0.0.0.0:8080
      - --chdir=/opt/netbox/netbox
      - --max-requests=20
      - --max-requests-jitter=5
      - netbox.wsgi
    ports:
      - "8001:8080"

  netbox-uwsgi:
    <<: *netbox
    profiles: ["uwsgi"]
    depends_on:
      netbox:
        condition: service_healthy
    environment:
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev,netbox.dev.server=uwsgi
    # Laid out like NetBox's contrib/uwsgi.ini: a uwsgi-protocol socket behind nginx (the
    # uwsgi-proxy service), master mode, one interpreter. uWSGI's own HTTP router (--http) is not
    # used: it closes every connection after the response without sending "Connection: close",
    # so a client that reuses the connection can have its next request dropped (issue #2).
    command:
      - /opt/netbox/venv/bin/uwsgi
      - --socket=0.0.0.0:8081
      - --master
      - --processes=3
      - --single-interpreter
      - --chdir=/opt/netbox/netbox
      - --module=netbox.wsgi
      - --need-app
      - --die-on-term
      - --max-requests=20
      # Adds worker_id * 5 to each worker's limit. uWSGI also keeps a worker for at least
      # min-worker-lifetime (10 s by default), so under sustained load the workers still tend to
      # be recycled together, every 10 s or so.
      - --max-requests-delta=5

  uwsgi-proxy:
    image: docker.io/nginx:1.29-alpine
    profiles: ["uwsgi"]
    depends_on:
      netbox-uwsgi:
        condition: service_started
        restart: true
    volumes:
      - ./nginx/uwsgi.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8002:8080"
    # Healthy once uWSGI has loaded NetBox and answers through nginx, so `up --wait` covers it.
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:8080/login/
      start_period: 300s
      timeout: 3s
      interval: 5s

  postgres:
    image: docker.io/postgres:18-alpine
    env_file: env/postgres.env
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    env_file: env/redis.env
    command: ["sh", "-c", "valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD"]
    healthcheck: &redis-healthcheck
      test: '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5

  redis-cache:
    image: docker.io/valkey/valkey:9.1-alpine
    env_file: env/redis-cache.env
    command: ["sh", "-c", "valkey-server --requirepass $$REDIS_PASSWORD"]
    healthcheck: *redis-healthcheck

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    # Root so the file exporter can write into the bind-mounted dev/data directory on any host.
    user: "0"
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
      - ./data/collector:/data

  # Grafana with Loki, Tempo and Prometheus in one container, for looking at the telemetry in a
  # browser. Only started with the `ui` profile; the Collector forwards to it only when
  # docker-compose.ui.yml is added as well (make dev-ui). OTLP ports stay internal, since the
  # Collector already publishes 4317 and 4318 on the host.
  otel-lgtm:
    image: docker.io/grafana/otel-lgtm:0.34.0
    profiles: ["ui"]
    environment:
      # The image defaults, stated here: anonymous access with the Admin role, no login needed.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    # The image's own check (ready file, then each component's health endpoint), polled more
    # often than the image's 30 s so `up --wait` returns soon after the stack is ready.
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      start_period: 180s
      timeout: 3s
      interval: 5s

  # Receives the e2e test's webhook, so the outbound request of the job succeeds.
  webhook-sink:
    image: docker.io/python:3.12-alpine
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from xml.sax.saxutils import escape

        class Sink(BaseHTTPRequestHandler):
            def do_POST(self):
                self.rfile.read(int(self.headers.get("Content-Length") or 0))
                self.send_response(204)
                self.end_headers()

            def do_GET(self):
                # An RSS feed whose only item title echoes the propagation headers it was fetched
                # with, so an e2e test can read them back from the dashboard page.
                traceparent = self.headers.get("traceparent", "")
                trace_id = traceparent.split("-")[1] if traceparent.count("-") == 3 else "none"
                probe = f"otel-probe tp={trace_id} bag={self.headers.get('baggage') or 'none'}"
                body = (
                    '<?xml version="1.0"?><rss version="2.0"><channel><title>sink</title>'
                    f"<item><title>{escape(probe)}</title></item></channel></rss>"
                ).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/rss+xml")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *args):
                pass

        ThreadingHTTPServer(("0.0.0.0", 8080), Sink).serve_forever()

volumes:
  postgres-data:
  netbox-scripts-files:
