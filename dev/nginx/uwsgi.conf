# Fronts the netbox-uwsgi service the way NetBox's contrib/nginx.conf does for uWSGI: nginx
# speaks HTTP to clients and the uwsgi protocol to the uWSGI socket.
server {
    listen 8080;

    client_max_body_size 25m;

    # Resolve netbox-uwsgi through Docker's DNS on each request (cached for 10 s) rather than once
    # at startup. A rebuild recreates netbox-uwsgi and it can come back on a different IP; a name
    # resolved at startup would keep pointing nginx at the old address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $netbox_uwsgi netbox-uwsgi:8081;

    location / {
        include uwsgi_params;
        uwsgi_pass $netbox_uwsgi;
    }
}
