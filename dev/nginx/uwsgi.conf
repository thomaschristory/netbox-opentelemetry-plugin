# Fronts the netbox-uwsgi service the way NetBox's contrib/nginx.conf does for uWSGI: nginx
# speaks HTTP to clients and the uwsgi protocol to the uWSGI socket.
server {
    listen 8080;

    client_max_body_size 25m;

    location / {
        include uwsgi_params;
        uwsgi_pass netbox-uwsgi:8081;
    }
}
