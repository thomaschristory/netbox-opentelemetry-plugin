[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netbox-opentelemetry-plugin"
dynamic = ["version"]
description = "Export NetBox logs, audit records, traces and metrics over OTLP."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "opentelemetry-api~=1.44.0",
    "opentelemetry-sdk~=1.44.0",
    "opentelemetry-exporter-otlp-proto-http~=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc~=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "requests>=2.32",
]

[tool.hatch.version]
path = "netbox_opentelemetry_plugin/version.py"

[tool.hatch.build.targets.wheel]
packages = ["netbox_opentelemetry_plugin"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs the dev compose stack running (make dev)"]
addopts = "-m 'not e2e'"
