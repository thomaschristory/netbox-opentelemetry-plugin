[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netbox-opentelemetry-plugin"
dynamic = ["version"]
description = "Export NetBox logs, audit records, traces and metrics over OTLP."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Thomas Christory" }]
keywords = ["netbox", "netbox-plugin", "opentelemetry", "otlp", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-api~=1.44.0",
    "opentelemetry-sdk~=1.44.0",
    "opentelemetry-exporter-otlp-proto-http~=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc~=1.44.0",
    "opentelemetry-instrumentation-django==0.65b0",
    "opentelemetry-instrumentation-psycopg==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "opentelemetry-instrumentation-requests==0.65b0",
    "opentelemetry-instrumentation-system-metrics==0.65b0",
]

[project.urls]
Homepage = "https://github.com/thomaschristory/netbox-opentelemetry-plugin"
Documentation = "https://thomaschristory.github.io/netbox-opentelemetry-plugin/"
Repository = "https://github.com/thomaschristory/netbox-opentelemetry-plugin"
Changelog = "https://github.com/thomaschristory/netbox-opentelemetry-plugin/blob/main/CHANGELOG.md"
Issues = "https://github.com/thomaschristory/netbox-opentelemetry-plugin/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "requests>=2.32",
    "rq==2.12.0",
    "django==6.1.1",
    "redis==8.1.0",
    "psycopg[binary]==3.3.5",
]

[tool.hatch.version]
path = "netbox_opentelemetry_plugin/version.py"

[tool.hatch.build.targets.wheel]
packages = ["netbox_opentelemetry_plugin"]

[tool.hatch.build.targets.sdist]
# Allowlist: hatchling honours .gitignore but not .git/info/exclude, so local-only files would
# otherwise end up in the sdist.
only-include = ["netbox_opentelemetry_plugin", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs the dev compose stack running (make dev)"]
addopts = "-m 'not e2e'"
